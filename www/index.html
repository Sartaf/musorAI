<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;if(localStorage.getItem('fs')==='l')document.documentElement.style.setProperty('--fs','1.2')}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Мої права">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Мої права</title>
<style>
:root{--bg:#0F1B2D;--card:#17283F;--line:#2C3C57;--tx:#F4F6FA;--mu:#A9B4C6;--ac:#F5B301;--on:#1A1203;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme]){--bg:#F6F8FB;--card:#FFFFFF;--line:#D3DAE6;--tx:#101A2B;--mu:#4A5870;--ac:#8A5E00;--on:#FFFFFF;color-scheme:light}}
:root[data-theme="light"]{--bg:#F6F8FB;--card:#FFFFFF;--line:#D3DAE6;--tx:#101A2B;--mu:#4A5870;--ac:#8A5E00;--on:#FFFFFF;color-scheme:light}
:root[data-theme="dark"]{--bg:#0F1B2D;--card:#17283F;--line:#2C3C57;--tx:#F4F6FA;--mu:#A9B4C6;--ac:#F5B301;--on:#1A1203;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:calc(16px*var(--fs,1))/1.4 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#app{max-width:480px;margin:0 auto;padding:20px 16px 28px}
h1{margin:0;font-size:28px;line-height:1.15}.mu{color:var(--mu);margin:6px 0 16px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button,.b{font:inherit;cursor:pointer}
.c{min-height:120px;border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.c b{font-size:calc(17px*var(--fs,1))}.c span{font-size:13px;color:var(--mu)}
ol{list-style:none;margin:16px 0;padding:0;display:flex;flex-direction:column;gap:12px}
li{display:flex;gap:12px}li i{flex:none;width:26px;height:26px;border-radius:13px;background:var(--ac);color:var(--on);font:700 14px/26px system-ui;text-align:center}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin:16px 0}
.box small{color:var(--mu)}.box p{font-size:calc(18px*var(--fs,1));margin:6px 0 12px}
.b{display:flex;align-items:center;justify-content:center;box-sizing:border-box;min-height:48px;border-radius:12px;border:1px solid var(--ac);background:transparent;color:var(--ac);font-weight:600;padding:0 14px;text-decoration:none}
.p{background:var(--ac);color:var(--on);border:0;font-weight:700}
.row{display:flex;gap:10px;margin-top:10px}.row>*{flex:1}
.rec{background:#b3261e!important;color:#fff!important;border-color:#b3261e!important}
#toast{position:fixed;left:12px;right:12px;bottom:18px;background:#222;color:#fff;padding:12px 14px;border-radius:12px;z-index:9;font-size:14px;line-height:1.4}
@media(min-width:700px){#app{max-width:1100px}.cols{display:grid;grid-template-columns:1.5fr 1fr;gap:24px;align-items:start}.g{grid-template-columns:repeat(3,1fr)}.c{min-height:104px}aside .box:first-child{margin-top:0}}
@media(min-width:1000px){.g{grid-template-columns:repeat(4,1fr)}}
@media(orientation:landscape) and (max-height:520px){#app{padding:10px 16px 16px}h1{font-size:22px}.mu{margin:2px 0 8px}.c{min-height:84px;padding:10px}ol{gap:8px;margin:10px 0}.box{margin:10px 0;padding:10px 14px}textarea{min-height:56px}}
audio{display:block}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.gear{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-size:22px;line-height:1}
.seg{display:flex;gap:8px;margin-top:8px}.seg .b{flex:1}.seg .b.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.fld{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);padding:12px 14px;font:inherit;margin-top:8px}
.split{display:flex;min-width:0}.split .b{flex:1;padding:0 8px}.split .b:first-child{border-radius:12px 0 0 12px}.split .b:last-child{border-radius:0 12px 12px 0;border-left:0}
.chip{display:inline-block;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--card);margin:0 6px 6px 0;border:1px solid var(--line)}
textarea{width:100%;box-sizing:border-box;min-height:84px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:12px 14px;font:inherit;resize:vertical;margin-bottom:10px}
#ans{white-space:pre-wrap;margin-top:12px;font-size:15px;line-height:1.45}
input[type=tel]{width:100%;box-sizing:border-box;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);padding:0 14px;font:inherit}
label small{display:block;color:var(--mu);margin:16px 0 6px}
.nm{display:block;font-size:12px;color:var(--mu);margin-top:4px}
.n{font-size:12px;color:var(--mu);margin-top:18px}.back{margin-bottom:12px;width:auto}
</style></head><body><div id="app"></div>
<script src="config.js"></script>
<script src="firebase-config.js"></script>
<script>
const BUILD='2026-11-26a';
const DEFMSG='Мені потрібна допомога. Зі мною зупинилася поліція або ТЦК.';
const LS={get:(k,d)=>{try{return localStorage.getItem(k)||d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function applyTheme(){const r=document.documentElement,t=LS.get('theme','auto');if(t==='auto')delete r.dataset.theme;else r.dataset.theme=t;r.style.setProperty('--fs',LS.get('fs','n')==='l'?'1.2':'1');const m=document.querySelector('meta[name=theme-color]');if(m)m.content=getComputedStyle(r).getPropertyValue('--bg').trim()||'#0F1B2D'}
let D=[],rec=null,t0=0;
const native=()=>!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform());
const recBtn=()=>native()?'<button class="b" style="width:100%;margin-top:10px" data-records>Мої записи</button>':'';
const A=document.getElementById('app'),L=()=>{try{return localStorage.getItem('sos')||''}catch(e){return ''}};
const sos=()=>`<label><small>Номер SOS-контакту</small><input type="tel" id="tel" value="${L()}" placeholder="+380…"></label><div class="row"><button class="b p" data-sos>Надіслати SOS</button><div class="split"><label class="b">Відео<input type="file" accept="video/*" capture hidden></label><button class="b${rec?' rec':''}" data-rec>${rec?'■ Стоп':'Диктофон'}</button></div></div>`;
function home(){A.innerHTML=`<div class="top"><h1>Мої права</h1><button class="gear" data-settings aria-label="Профіль і налаштування">👤</button></div><p class="mu">Що сталося? Оберіть ситуацію</p><div class="cols"><div><div class="g">${D.map(d=>`<button class="c" data-k="${d.id}"><b>${d.title}</b><span>${d.subtitle}</span></button>`).join('')}</div></div><aside><div class="box" style="margin-top:0"><small>Не знайшли ситуацію? Запитайте ШІ-довідник</small><textarea id="q" placeholder="Опишіть ситуацію своїми словами"></textarea><button class="b p" style="width:100%" data-ask>Запитати</button><div id="ans"></div></div>${sos()}${recBtn()}</aside></div><p class="n">Довідкова інформація, а не юридична консультація. Тексти потребують перевірки юристом. Збірка ${BUILD}</p>`}
function show(k){const d=D.find(x=>x.id===k);A.innerHTML=`<button class="b back" data-back>← Назад</button><h1>${d.title}</h1><div class="cols"><div><ol>${d.steps.map((x,i)=>`<li><i>${i+1}</i><span>${x.text}<small class="nm">Підстава: ${x.ref} · ${x.found?'знайдено в джерелах':'потребує перевірки'}</small></span></li>`).join('')}</ol></div><aside><div class="box"><small>Скажіть вголос</small><p>«${d.phrase}»</p><button class="b" style="width:100%" data-say="${k}">Озвучити фразу</button></div><div><span class="chip">Потрібна перевірка юриста</span></div>${sos()}</aside></div>`}
A.onclick=e=>{const k=e.target.closest('[data-k]');if(k)return go('show',k.dataset.k);if(e.target.closest('[data-back]'))return back();if(e.target.closest('[data-settings]'))return go('settings');const s=e.target.closest('[data-say]');if(s){say(D.find(x=>x.id===s.dataset.say).phrase)}if(e.target.closest('[data-rec]'))toggleRec();if(e.target.closest('[data-sos]')){const n=document.getElementById('tel').value.trim();if(n)location.href='sms:'+n+'?body='+encodeURIComponent(LS.get('sosmsg',DEFMSG)+(LS.get('name','')?' Мене звати '+LS.get('name','')+'.':''))}};
A.onchange=e=>{if(e.target.id==='tel'||e.target.id==='tel2')LS.set('sos',e.target.value);if(e.target.id==='sosmsg')LS.set('sosmsg',e.target.value.trim()||DEFMSG);if(e.target.id==='pname')LS.set('name',e.target.value.trim())};
function render(st){window.scrollTo(0,0);st=st||{s:'home'};if(st.s==='show')show(st.a);else if(st.s==='settings')settings();else if(st.s==='records')records();else home()}
function go(s,a){history.pushState({s:s,a:a||null},'');render({s:s,a:a})}
function back(){if(history.state&&history.state.s&&history.state.s!=='home')history.back();else{history.replaceState({s:'home'},'');render({s:'home'})}}
window.addEventListener('popstate',e=>render(e.state));
function settings(){
  const th=LS.get('theme','auto'),fs=LS.get('fs','n');
  const seg=(name,cur,opts)=>'<div class="seg">'+opts.map(o=>'<button class="b'+(cur===o[0]?' on':'')+'" data-set="'+name+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>';
  A.innerHTML='<button class="b back" data-back>← Назад</button><h1>Профіль</h1>'
   +'<div class="box"><small>Ім’я (необов’язково)</small><input class="fld" id="pname" type="text" placeholder="Як вас звати" autocomplete="name"><small style="display:block;margin-top:12px">Акаунт</small>'+accountBlock()+'</div>'
   +'<h2 style="margin:20px 0 0;font-size:20px">Налаштування</h2>'
   +'<div class="box"><small>Тема</small>'+seg('theme',th,[['auto','Авто'],['light','Світла'],['dark','Темна']])+'</div>'
   +'<div class="box"><small>Розмір тексту</small>'+seg('fs',fs,[['n','Звичайний'],['l','Великий']])+'</div>'
   +'<div class="box"><small>Контакт для SOS</small><input class="fld" id="tel2" type="tel" placeholder="+380…"><small style="display:block;margin-top:12px">Текст повідомлення SOS</small><textarea class="fld" id="sosmsg" rows="3"></textarea></div>'
   +'<div class="box"><small>ШІ-довідник</small><p style="font-size:16px">'+(window.API_URL?'Підключено':'Ще не підключено')+'</p></div>'
   +(native()?'<button class="b" style="width:100%" data-records>Мої записи</button>':'')
   +'<div class="box"><small>Про застосунок</small><p style="font-size:15px">Збірка '+BUILD+'. Довідкова інформація, не юридична консультація. Норми взято з офіційних текстів на zakon.rada.gov.ua; перелік джерел: docs/SOURCES.md у репозиторії Sartaf/musorAI.</p></div>';
  document.getElementById('tel2').value=LS.get('sos','');
  document.getElementById('pname').value=LS.get('name','');
  document.getElementById('sosmsg').value=LS.get('sosmsg',DEFMSG);
}
A.addEventListener('click',e=>{const t=e.target.closest('[data-set]');if(!t)return;const y=window.scrollY;LS.set(t.dataset.set,t.dataset.v);applyTheme();settings();window.scrollTo(0,y)});

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let FB=null;
async function fb(){
  if(FB)return FB;
  if(!window.FIREBASE_CONFIG)throw {code:'nocfg'};
  const load=window.__fbload||(u=>import(u)),base='https://www.gstatic.com/firebasejs/10.14.1/';
  const mods=await Promise.all([load(base+'firebase-app.js'),load(base+'firebase-auth.js')]);
  const app=mods[0].initializeApp(window.FIREBASE_CONFIG),m=mods[1],auth=m.getAuth(app);
  FB={auth:auth,m:m};
  m.onAuthStateChanged(auth,u=>{window.USER=u;if(history.state&&history.state.s==='settings')settings()});
  return FB;
}
function accountBlock(){
  const u=window.USER;
  if(!window.FIREBASE_CONFIG)return '<p style="font-size:15px;margin:6px 0 0">Вхід ще не налаштовано. Усі підказки працюють без реєстрації.</p>';
  if(u)return '<p style="font-size:15px;margin:6px 0 10px">Ви увійшли: <b>'+esc(u.email||'')+'</b></p><button class="b" style="width:100%" data-auth="out">Вийти</button>';
  return '<p style="font-size:15px;margin:6px 0 4px">Вхід необов’язковий. Усі підказки працюють без нього.</p><input class="fld" id="aemail" type="email" placeholder="E-mail" autocomplete="email"><input class="fld" id="apass" type="password" placeholder="Пароль (від 6 символів)" autocomplete="current-password"><div class="seg"><button class="b on" data-auth="in">Увійти</button><button class="b" data-auth="up">Створити акаунт</button></div><button class="b" style="width:100%;margin-top:8px" data-auth="reset">Забули пароль?</button><div id="amsg" class="mu" style="margin-top:8px"></div>';
}
function authErr(e){
  const m={'auth/invalid-email':'Некоректний e-mail.','auth/invalid-credential':'Невірний e-mail або пароль.','auth/wrong-password':'Невірний e-mail або пароль.','auth/user-not-found':'Невірний e-mail або пароль.','auth/email-already-in-use':'Такий акаунт уже існує. Натисніть «Увійти».','auth/weak-password':'Пароль закороткий (від 6 символів).','auth/network-request-failed':'Немає зв’язку з інтернетом.','auth/too-many-requests':'Забагато спроб. Спробуйте пізніше.',nocfg:'Вхід ще не налаштовано.'};
  return m[e&&e.code]||'Не вдалося виконати дію.';
}
A.addEventListener('click',async e=>{
  const t=e.target.closest('[data-auth]');if(!t)return;
  const msg=document.getElementById('amsg'),say=x=>{if(msg)msg.textContent=x},k=t.dataset.auth;
  try{
    const F=await fb();
    if(k==='out'){await F.m.signOut(F.auth);return}
    const em=document.getElementById('aemail').value.trim(),pw=document.getElementById('apass').value;
    if(k==='reset'){if(!em){say('Введіть e-mail.');return}await F.m.sendPasswordResetEmail(F.auth,em);say('Лист для скидання пароля надіслано.');return}
    if(!em||pw.length<6){say('Введіть e-mail і пароль (від 6 символів).');return}
    say('Зачекайте…');
    if(k==='up')await F.m.createUserWithEmailAndPassword(F.auth,em,pw);else await F.m.signInWithEmailAndPassword(F.auth,em,pw);
  }catch(err){say(authErr(err))}
});

function toast(m){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>{t.style.display='none'},6000)}
async function say(text){
  const P=window.Capacitor&&Capacitor.Plugins,T=P&&P.TextToSpeech;
  if(T){
    try{
      let ok=true;try{ok=(await T.isLanguageSupported({lang:'uk-UA'})).supported}catch(e){}
      if(!ok){toast('Немає українського голосу. Android: Налаштування → Мова → Синтез мовлення → Українська.');return}
      try{await T.stop()}catch(e){}
      await T.speak({text:text,lang:'uk-UA',rate:0.95,pitch:1,volume:1});return
    }catch(e){}
  }
  if(!window.speechSynthesis){toast('Озвучення недоступне на цьому пристрої.');return}
  speechSynthesis.cancel();
  setTimeout(()=>{const v=speechSynthesis.getVoices().find(x=>/^uk/i.test(x.lang));const u=new SpeechSynthesisUtterance(text);u.lang='uk-UA';if(v)u.voice=v;u.rate=0.95;u.onerror=()=>toast('Не вдалося озвучити фразу.');speechSynthesis.speak(u)},120)
}
function recUI(){const s=Math.floor((Date.now()-t0)/1000),m=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');document.querySelectorAll('[data-rec]').forEach(b=>{b.textContent=rec?'■ Стоп '+m:'Диктофон';b.classList.toggle('rec',!!rec)})}
async function toggleRec(){
  if(rec){rec.stop();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const mime=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
    const chunks=[],mr=new MediaRecorder(stream,mime?{mimeType:mime}:{});
    let wl=null;try{wl=await navigator.wakeLock.request('screen')}catch(e){}
    mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
    const tick=setInterval(recUI,500);
    mr.onstop=async()=>{clearInterval(tick);stream.getTracks().forEach(t=>t.stop());try{wl&&wl.release()}catch(e){}rec=null;recUI();await saveAudio(new Blob(chunks,{type:mr.mimeType||'audio/webm'}),mr.mimeType||'')};
    mr.start(1000);rec=mr;t0=Date.now();recUI()
  }catch(e){toast('Немає доступу до мікрофона. Дозвольте його в налаштуваннях застосунку.')}
}
async function saveAudio(blob,mime){
  const ext=/mp4/.test(mime)?'m4a':'webm',name='zapys-'+new Date().toISOString().replace(/[:.]/g,'-').slice(0,19)+'.'+ext;
  const P=window.Capacitor&&Capacitor.Plugins;
  if(P&&P.Filesystem){
    try{
      const b64=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(blob)});
      await P.Filesystem.writeFile({path:'records/'+name,data:b64,directory:'DATA',recursive:true});
      toast('Запис збережено. Він у розділі «Мої записи».');
    }catch(e){toast('Не вдалося зберегти запис.')}
    return
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Запис збережено в завантаження.')
}
async function records(){
  const P=window.Capacitor&&Capacitor.Plugins;let list=[];
  try{if(P&&P.Filesystem)list=(await P.Filesystem.readdir({path:'records',directory:'DATA'})).files||[]}catch(e){}
  list.sort((x,y)=>String(y.name).localeCompare(String(x.name)));
  A.innerHTML='<button class="b back" data-back>← Назад</button><h1>Мої записи</h1>'+(list.length?'<ol>'+list.map(f=>'<li><span>'+f.name+'<div class="row"><button class="b" data-play="'+f.name+'">▶ Слухати</button><button class="b" data-share="'+f.name+'">Поділитися</button><button class="b" data-del="'+f.name+'">Видалити</button></div><div class="pl"></div></span></li>').join('')+'</ol>':'<p class="mu">Записів поки немає.</p>')
}
A.addEventListener('click',async e=>{
  const t=e.target.closest('[data-records],[data-play],[data-share],[data-del]');if(!t)return;
  const P=window.Capacitor&&Capacitor.Plugins;if(!P||!P.Filesystem)return;
  if(t.dataset.records!==undefined){go('records');return}
  const n=t.dataset.play||t.dataset.share||t.dataset.del,path='records/'+n;
  try{
    if(t.dataset.play){const r=await P.Filesystem.readFile({path:path,directory:'DATA'});const mt=/m4a$/.test(n)?'audio/mp4':'audio/webm';const box=t.closest('li').querySelector('.pl');box.innerHTML='<audio controls autoplay style="width:100%;margin-top:8px"></audio>';box.firstChild.src='data:'+mt+';base64,'+r.data}
    else if(t.dataset.share){await P.Filesystem.copy({from:path,directory:'DATA',to:n,toDirectory:'CACHE'});const u=await P.Filesystem.getUri({path:n,directory:'CACHE'});await P.Share.share({title:'Запис',url:u.uri})}
    else if(t.dataset.del){await P.Filesystem.deleteFile({path:path,directory:'DATA'});records()}
  }catch(err){toast('Не вдалося виконати дію із записом.')}
});
function ask(){const q=document.getElementById('q').value.trim(),o=document.getElementById('ans');if(!q)return;if(!window.API_URL){o.textContent='ШІ-довідник ще не підключено. Скористайтеся сценаріями.';return}o.textContent='Шукаю в базі…';fetch(window.API_URL+'/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})}).then(r=>r.json()).then(j=>{o.textContent=j.answer||j.error||'Помилка'}).catch(()=>{o.textContent='Немає зв’язку. Скористайтеся сценаріями.'})}
A.addEventListener('click',e=>{if(e.target.closest('[data-ask]'))ask()});
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)&&!window.Capacitor)navigator.serviceWorker.register('sw.js').catch(()=>{});
fetch('scenarios.json').then(r=>r.json()).then(j=>{D=j;history.replaceState({s:'home'},'');applyTheme();home();if(window.FIREBASE_CONFIG)fb().catch(()=>{})}).catch(()=>{A.innerHTML='<p class="mu">Не вдалося завантажити дані.</p>'});
</script></body></html>
