name: Build knowledge base
on:
  workflow_dispatch:
  push:
    tags: ['kb-*']
permissions:
  contents: write
jobs:
  kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build
        run: |
          mkdir -p knowledge
          { curl -s -m 30 -o /dev/null -w "rada http %{http_code}\n" -A "Mozilla/5.0" "https://zakon.rada.gov.ua/laws/show/580-19/print" || echo "curl failed"; python3 scripts/build_kb.py; } 2>&1 | tee knowledge/_build.log
      - name: Commit knowledge/
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add knowledge
          if git diff --cached --quiet; then
            echo "Без змін"
          else
            git commit -m "Оновлено базу знань"
            git push
          fi
