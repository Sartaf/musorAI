name: Build knowledge base
on:
  workflow_dispatch:
  push:
    tags: ['kb-*']
permissions:
  contents: write
jobs:
  kb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Probe sources
        run: |
          for u in https://zakon.rada.gov.ua/laws/show/580-19 https://data.rada.gov.ua/ https://www.president.gov.ua/ua/documents/constitution/konstituciya-ukrayini-rozdil-ii https://ips.ligazakon.net/ https://www.ukraine.com.ua/laws/kupap/268/ https://kodeksy.com.ua/kpku-2012/236.htm https://protocol.ua/ua/pro_natsionalnu_politsiyu_stattya_32/; do
            c=$(curl -s -m 12 -o /dev/null -w "%{http_code}" -A "Mozilla/5.0" "$u" || true)
            echo "$c $u"
          done | tee knowledge/_probe.log
      - name: Build
        run: |
          mkdir -p knowledge
          { curl -s -m 30 -o /dev/null -w "rada http %{http_code}\n" -A "Mozilla/5.0" "https://zakon.rada.gov.ua/laws/show/580-19/print" || echo "curl failed"; python3 scripts/build_kb.py; } 2>&1 | tee knowledge/_build.log
      - name: Commit knowledge/
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add knowledge
          if git diff --cached --quiet; then
            echo "Без змін"
          else
            git commit -m "Оновлено базу знань"
            git push
          fi
